unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix

setw -g mode-keys vi
# Enable mouse support
set -g mouse on

# Set 256 color and true color (Tc/RGB) support
set -g default-terminal "xterm-256color"
set -as terminal-features ",*:RGB"
set -as terminal-features ",*:hyperlinks"

# Split panes using | and -
bind | split-window -h
bind - split-window -v
unbind '"'
unbind %

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Reload config
bind r source-file ~/.config/tmux/tmux.conf \; display-message "Config reloaded!"

# ── Tomorrow Night Blue Theme ─────────────────────────────────────────────────

# Status bar
set -g status-bg '#001b3d'
set -g status-fg '#7285b7'
set -g status-left ''
set -g status-right '#[fg=#ffeead,bold]%H:%M '
set-option -s status-interval 1

# Window list
set -g window-status-format '#[fg=#7285b7] #I:#W '
set -g window-status-current-format '#[fg=#ffffff,bg=#003f8e,bold] #I:#W '
set -g window-status-separator ''

# Pane borders
set -g pane-border-style 'fg=#00346e'
set -g pane-active-border-style 'fg=#bbdaff'

# Message and command prompt
set -g message-style 'fg=#ffffff,bg=#003f8e'
set -g mode-style 'fg=#ffffff,bg=#003f8e'
