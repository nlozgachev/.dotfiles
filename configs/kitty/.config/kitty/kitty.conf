# Typography
font_family      Maple Mono
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        14.0

# Tomorrow Night Blue Color Scheme
background            #002451
foreground            #ffffff
selection_background  #003f8e
selection_foreground  #ffffff
url_color             #99ffff
cursor                #ffffff
cursor_text_color     #002451

# ANSI 16 Colors
# Black
color0                #000000
color8                #7285b7
# Red
color1                #ff9da4
color9                #ff9da4
# Green
color2                #d1f1a9
color10               #d1f1a9
# Yellow
color3                #ffeead
color11               #ffeead
# Blue
color4                #bbdaff
color12               #bbdaff
# Magenta
color5                #ebbbff
color13               #ebbbff
# Cyan
color6                #99ffff
color14               #99ffff
# White
color7                #ffffff
color15               #ffffff

# Window & Layout
window_padding_width         0
hide_window_decorations      no
confirm_os_window_close      0
enable_audio_bell            no

# macOS Integration
macos_option_as_alt          yes
macos_quit_when_last_window_closed yes

# macOS Shortcut Bridges (Helix / Terminal)
# Cmd+S: Save buffer (:w)
map cmd+s send_text all \x13
# Cmd+P: File picker (Space + f)
map cmd+p send_text all \x10
# Cmd+/: Toggle line comment (Ctrl + c)
map cmd+/ send_text all \x03
# Cmd+Shift+P: Command palette (Alt + x)
map cmd+shift+p send_text all \x1bx
# Cmd+Shift+F: Global ripgrep search (Space + /)
map cmd+shift+f send_text all \x20/

# Window Management
map cmd+n new_os_window
map cmd+f toggle_fullscreen
