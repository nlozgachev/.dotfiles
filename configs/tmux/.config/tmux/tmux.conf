unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix

setw -g mode-keys vi
# Enable mouse support
set -g mouse on

# Set 256 color support
set -g default-terminal "screen-256color"

# Split panes using | and -
bind | split-window -h
bind - split-window -v
unbind '"'
unbind %


bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R


# Reload config
bind r source-file ~/.config/tmux/tmux.conf \; display-message "Config reloaded!"

# Status bar - window names
set -g status-bg '#111111'
set -g status-fg '#414141'
set -g status-left ''
set -g status-right '#[fg=#ffcc33]%H:%M '
set-option -s status-interval 1
set -as terminal-features ",*:hyperlinks"

# Window list
set -g window-status-format '#[fg=#414141] #I:#W '
set -g window-status-current-format '#[fg=#fcdc08,bold] #I:#W '
set -g window-status-separator ''

# Pane borders
set -g pane-border-style 'fg=#414141'
set -g pane-active-border-style 'fg=#ffcc33'
