# Typography
font_family      Maple Mono
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        13.0

# Tomorrow Night Blue Color Scheme
background            #002451
foreground            #ffffff
selection_background  #003f8e
selection_foreground  #ffffff
url_color             #99ffff
cursor                #ffffff
cursor_text_color     #002451
cursor_blink_interval 0

# ANSI 16 Colors
# Black
color0                #000000
color8                #7285b7
# Red
color1                #ff9da4
color9                #ff9da4
# Green
color2                #d1f1a9
color10               #d1f1a9
# Yellow
color3                #ffeead
color11               #ffeead
# Blue
color4                #bbdaff
color12               #bbdaff
# Magenta
color5                #ebbbff
color13               #ebbbff
# Cyan
color6                #99ffff
color14               #99ffff
# White
color7                #ffffff
color15               #ffffff

# Window & Layout
scrollback_lines             10000
window_padding_width         0
hide_window_decorations      no
confirm_os_window_close      0
enable_audio_bell            no

# macOS Integration & Shortcuts
macos_titlebar_color         dark
macos_option_as_alt          yes
macos_quit_when_last_window_closed yes

# Clipboard
copy_on_select               clipboard
clipboard_control            write-clipboard write-primary read-clipboard read-primary
map cmd+c                    copy_or_noop
map cmd+v                    paste_from_clipboard

# ── Helix Editor Bridging (Cmd ⌘) ────────────────────────────
map cmd+s                    send_text all \x13
map cmd+p                    send_text all \x10
map cmd+f                    send_text all \x06
map cmd+shift+f              send_text all \x07
map cmd+w                    send_text all \x17
map cmd+b                    send_text all \x02
map cmd+r                    send_text all \x12
map cmd+z                    send_text all \x1a
map cmd+shift+z              send_text all \x19
map cmd+/                    send_text all \x03
map cmd+[                    send_text all \x1b[91;5u
map cmd+]                    send_text all \x1b[93;5u
map cmd+shift+[              send_text all \x1b[91;6u
map cmd+shift+]              send_text all \x1b[93;6u

# Window Management
map cmd+n                    new_os_window
map cmd+ctrl+f               toggle_fullscreen
