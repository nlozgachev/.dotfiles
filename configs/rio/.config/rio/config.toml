# Font configuration
[fonts]
family = "Maple Mono"
size = 12


#[fonts.bold]
#family = "IosevkaTerm Nerd Font Mono"
#style = "Bold"

#[fonts.italic]
#family = "IosevkaTerm Nerd Font Mono"
#style = "SemiBold Italic"

#[fonts.bold-italic]
#family = "IosevkaTerm Nerd Font Mono"
#style = "Bold Italic"

# Navigation - disable for tmux
navigation.mode = "Plain"

# Keyboard
keyboard.use-kitty-keyboard-protocol = false

# Window configuration
[window]
mode = "Windowed"
decorations = "Enabled"
opacity = 1.0

# Padding
padding-x = 0
padding-y = 0

# Key bindings
[bindings]
keys = [
    # Rio doesn't support global keybinds or quick terminal toggle
    # These are Rio-specific alternatives:
    { key = "n", with = "super", action = "CreateWindow" },  # Cmd+N for new window
    { key = "f", with = "super", action = "Maximize" },  # Cmd+F to toggle fullscreen
]

[colors]
background = '#002451'
foreground = '#ffffff'
selection-background = '#003f8e'
selection-foreground = '#ffffff'
cursor = '#ffffff'
black = '#000000'
red = '#ff9da4'
green = '#d1f1a9'
yellow = '#ffeead'
blue = '#bbdaff'
magenta = '#ebbbff'
cyan = '#99ffff'
white = '#ffffff'
light_black = '#000000'
light_red = '#ff9da4'
light_green = '#d1f1a9'
light_yellow = '#ffeead'
light_blue = '#bbdaff'
light_magenta = '#ebbbff'
light_cyan = '#99ffff'
light_white = '#ffffff'
